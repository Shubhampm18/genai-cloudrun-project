[project]
name = "gen-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

